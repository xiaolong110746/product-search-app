// ==========================================
// 筛选状态显示 - 增强版（支持点击删除）
// ==========================================
// 列名映射（英文字段名 -> 中文显示名）
const columnNameMap = {
    'name': '商品名称',
    'cost': '进价（条）',
    'priceStrip': '售价（条）',
    'suggestStrip': '建议价（条）',
    'pricePack': '售价（包）',
    'suggestPack': '建议价（包）',
    'barcodeStrip': '条码',
    'barcodePack': '包码',
    'remark': '备注'
};

// 筛选类型映射
const filterTypeMap = {
    'equals': '等于',
    'notEqual': '不等于',
    'lessThan': '小于',
    'greaterThan': '大于',
    'lessThanOrEqual': '小于等于',
    'greaterThanOrEqual': '大于等于',
    'inRange': '范围',
    'contains': '包含',
    'notContains': '不包含',
    'startsWith': '开头为',
    'endsWith': '结尾为',
    'blank': '为空',
    'notBlank': '不为空'
};

// 存储当前筛选标签的信息，用于点击删除
let currentFilterTags = [];

function updateFilterStatus() {
    const filterStatus = document.getElementById('filterStatus');
    const filterTags = document.getElementById('filterTags');
    
    // 重置标签信息数组
    currentFilterTags = [];
    let tagsHtml = [];
    
    // 搜索框筛选
    if (currentSearchText.trim()) {
        const tagId = 'tag-search';
        currentFilterTags.push({
            id: tagId,
            type: 'search',
            data: currentSearchText.trim()
        });
        tagsHtml.push(`<span class="filter-tag search" id="${tagId}"><span class="tag-text">📝 搜索"${escapeHtml(currentSearchText.trim())}"</span></span>`);
    }
    
    // AG Grid 排序状态（通过 getColumnState 获取）
    if (gridApi) {
        const columnStates = gridApi.getColumnState();
        const sortColumns = columnStates.filter(col => col.sort);
        for (const sortItem of sortColumns) {
            const colName = columnNameMap[sortItem.colId] || sortItem.colId;
            const sortDir = sortItem.sort === 'asc' ? '升序' : '降序';
            const tagId = `tag-sort-${sortItem.colId}`;
            currentFilterTags.push({
                id: tagId,
                type: 'sort',
                data: sortItem.colId
            });
            tagsHtml.push(`<span class="filter-tag sort" id="${tagId}"><span class="tag-text">⬆⬇ ${colName} ${sortDir}</span></span>`);
        }
    }

    // AG Grid 列筛选
    if (gridApi) {
        const filterModel = gridApi.getFilterModel();
        for (const field in filterModel) {
            const filter = filterModel[field];
            const colName = columnNameMap[field] || field;
            
            // 检查是否有多个条件
            if (filter.conditions && filter.conditions.length > 0) {
                // 多个条件
                const operator = filter.operator === 'AND' ? ' 且 ' : ' 或 ';
                const conditionTexts = filter.conditions.map(cond => {
                    const filterType = filterTypeMap[cond.type] || cond.type;
                    let filterValue = '';
                    if (cond.type === 'inRange') {
                        filterValue = `${cond.filter} ~ ${cond.filterTo}`;
                    } else if (cond.filter !== undefined) {
                        filterValue = cond.filter;
                    }
                    return `${filterType} ${filterValue}`;
                });
                const tagId = `tag-column-${field}`;
                currentFilterTags.push({
                    id: tagId,
                    type: 'column',
                    data: field
                });
                tagsHtml.push(`<span class="filter-tag column" id="${tagId}"><span class="tag-text">🔍 ${colName} ${conditionTexts.join(operator)}</span></span>`);
            } else {
                // 单个条件
                const filterType = filterTypeMap[filter.type] || filter.type;
                let filterValue = '';
                
                if (filter.type === 'inRange') {
                    filterValue = `${filter.filter} ~ ${filter.filterTo}`;
                } else if (filter.filter !== undefined) {
                    filterValue = filter.filter;
                }
                
                const tagId = `tag-column-${field}`;
                currentFilterTags.push({
                    id: tagId,
                    type: 'column',
                    data: field
                });
                tagsHtml.push(`<span class="filter-tag column" id="${tagId}"><span class="tag-text">🔍 ${colName} ${filterType} ${filterValue}</span></span>`);
            }
        }
    }
    
    // 获取当前显示的记录数
    let displayedCount = 0;
    if (gridApi) {
        displayedCount = gridApi.getDisplayedRowCount();
    }
    
    // 显示或隐藏状态区
    if (tagsHtml.length > 0) {
        filterStatus.classList.add('visible');
        filterTags.innerHTML = tagsHtml.join('');
        
        // 绑定点击事件
        currentFilterTags.forEach(tagInfo => {
            const tagElement = document.getElementById(tagInfo.id);
            if (tagElement) {
                tagElement.addEventListener('click', function() {
                    handleTagClick(tagInfo.id);
                });
            }
        });
    } else {
        filterStatus.classList.remove('visible');
    }
    
    // 同步更新页脚的记录数
    updateFooterCount();
}

// 处理标签点击 - 带动画效果
function handleTagClick(tagId) {
    const tagInfo = currentFilterTags.find(t => t.id === tagId);
    if (!tagInfo) return;
    
    const tagElement = document.getElementById(tagId);
    if (!tagElement) return;
    
    // 添加删除动画类
    tagElement.classList.add('removing');
    
    // 动画结束后执行删除操作（动画时长 0.35s）
    setTimeout(() => {
        if (tagInfo.type === 'search') {
            // 删除搜索标签，不重复播放动画
            clearSearchOnly(true, false);
            showToast('✅ 已删除搜索条件');
        } else if (tagInfo.type === 'column') {
            // 删除列筛选标签
            clearColumnFilter(tagInfo.data);
        } else if (tagInfo.type === 'sort') {
            // 删除排序标签：取消该列排序
            if (gridApi) {
                const allCols = gridApi.getColumnState();
                const remainingSort = allCols.filter(col => col.sort && col.colId !== tagInfo.data);
                if (remainingSort.length > 0) {
                    // 还有其他排序列，只移除当前列
                    gridApi.applyColumnState({ sort: remainingSort.map(col => ({ colId: col.colId, sort: col.sort })) });
                } else {
                    // 没有其他排序列了，清除所有排序恢复无序状态
                    allCols.forEach(col => { if (col.sort) col.sort = null; });
                    gridApi.applyColumnState({ state: allCols });
                }
            }
            // 不需要手动调用 updateFilterStatus()，onSortChanged 会自动触发
            showToast('✅ 已取消排序');
        }
    }, 350);
}

// 清除单个列的筛选（带动画反馈）
function clearColumnFilter(field) {
    if (gridApi) {
        const filterModel = gridApi.getFilterModel();
        if (filterModel[field]) {
            delete filterModel[field];
            gridApi.setFilterModel(filterModel);
        }
    }
    
    // 如果搜索框有内容，重新应用搜索
    if (currentSearchText.trim()) {
        filterData(currentSearchText);
    } else if (gridApi) {
        gridApi.setGridOption('rowData', allData);
        updateCount(allData.length);
        lastFilteredCount = allData.length;
    }
    
    updateFilterStatus();
    showToast('✅ 已删除此筛选条件');
}

// 给标签添加删除动画，返回 Promise
function animateTagRemove(tagElement) {
    return new Promise(resolve => {
        tagElement.classList.add('removing');
        setTimeout(resolve, 350);
    });
}

// 清除所有筛选标签的动画
async function animateAllTagsRemove(tagIds) {
    // 并行执行所有标签的删除动画
    const promises = tagIds.map(id => {
        const el = document.getElementById(id);
        if (el) return animateTagRemove(el);
        return Promise.resolve();
    });
    await Promise.all(promises);
}

function clearAllFilters() {
    // 获取所有标签ID
    const tagIds = currentFilterTags.map(t => t.id);
    
    if (tagIds.length === 0) {
        // 没有标签，直接执行
        hoveredKeyword = null;
        activeMobileKeyword = null;
    
        stopFlashTimer();
        input.value = '';
        currentSearchText = '';
        if (gridApi) {
            gridApi.setGridOption('rowData', allData);
            gridApi.redrawRows();
        }
        updateCount(allData.length);
        lastFilteredCount = allData.length;
        input.focus();
        return;
    }
    
    // 先播放动画
    animateAllTagsRemove(tagIds).then(() => {
        // 重置所有高亮状态
        hoveredKeyword = null;
        activeMobileKeyword = null;
    
        stopFlashTimer();
        if (autoTagTimer) { clearTimeout(autoTagTimer); autoTagTimer = null; }
        // 动画完成后清除搜索关键字
        currentKeywords = [];
        cursorPosition = 0;
        renderSearchTags();
        input.value = '';
        currentSearchText = '';
        lastSearchedKeywordsStr = '';
        
        // 清除 AG Grid 筛选和排序
        if (gridApi) {
            gridApi.setFilterModel(null);
            const colState = gridApi.getColumnState();
            colState.forEach(col => { if (col.sort) col.sort = null; });
            gridApi.applyColumnState({ state: colState });
            gridApi.setGridOption('rowData', allData);
            gridApi.redrawRows();
        }
        
        // 更新显示
        updateCount(allData.length);
        lastFilteredCount = allData.length;
        updateFilterStatus();
        input.focus();
        
        showToast('✅ 已清除所有筛选条件');
    });
}

function clearSearchOnly(skipToast = false, withAnimation = true) {
    const searchTagId = 'tag-search';
    const searchTag = document.getElementById(searchTagId);
    
    // 如果需要动画且有搜索标签
    if (withAnimation && searchTag && currentSearchText.trim()) {
        animateTagRemove(searchTag).then(() => {
            executeClearSearch(skipToast);
        });
    } else {
        executeClearSearch(skipToast);
    }
}

function executeClearSearch(skipToast) {

    activeMobileKeyword = null;

    stopFlashTimer();
    if (autoTagTimer) { clearTimeout(autoTagTimer); autoTagTimer = null; }

    lastFilteredCount = allData.length;
    updateFilterStatus();

}

function clearFilterOnly() {
    // 获取所有列筛选和排序标签ID
    const columnTagIds = currentFilterTags
        .filter(t => t.type === 'column' || t.type === 'sort')
        .map(t => t.id);
    
    if (columnTagIds.length === 0) {
        // 没有列筛选标签
        showToast('✅ 当前没有列筛选条件');
        return;
    }
    
    // 先播放动画
    animateAllTagsRemove(columnTagIds).then(() => {

        if (gridApi) {
            gridApi.setFilterModel(null);
            const colState = gridApi.getColumnState();
            colState.forEach(col => { if (col.sort) col.sort = null; });
            gridApi.applyColumnState({ state: colState });
        }
        
        // 如果搜索框有内容，重新应用搜索
        if (currentSearchText.trim()) {
            filterData(currentSearchText);
        } else {
            gridApi.setGridOption('rowData', allData);
            updateCount(allData.length);
            lastFilteredCount = allData.length;
        }
        
        updateFilterStatus();
        showToast('✅ 已清除列筛选条件');
    });
}

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    }[m]));
}

// ==========================================
// 自定义右键菜单
// ==========================================
let contextMenuTargetCell = null;

function initContextMenu() {
    const contextMenu = document.getElementById('contextMenu');
    const menuCopy = document.getElementById('menuCopy');
    
    // 公共函数：显示右键菜单
    function showContextMenuAt(x, y, targetCell) {
        contextMenuTargetCell = targetCell;
        contextMenu.classList.add('visible');
        const menuWidth = contextMenu.offsetWidth;
        const menuHeight = contextMenu.offsetHeight;
        if (x + menuWidth > window.innerWidth) {
            x = window.innerWidth - menuWidth - 10;
        }
        if (y + menuHeight > window.innerHeight) {
            y = window.innerHeight - menuHeight - 10;
        }
        contextMenu.style.left = x + 'px';
        contextMenu.style.top = y + 'px';
    }
    
    // 监听表格区域的右键事件
    document.getElementById('myGrid').addEventListener('contextmenu', function(e) {
        e.preventDefault();
        const cell = e.target.closest('.ag-cell');
        if (cell) {
            showContextMenuAt(e.clientX, e.clientY, cell);
        }
    });
    
    // 手机端长按触发右键菜单
    let longPressTimer = null;
    let longPressTarget = null;
    
    document.getElementById('myGrid').addEventListener('touchstart', function(e) {
        const cell = e.target.closest('.ag-cell');
        if (!cell) return;
        longPressTarget = cell;
        longPressTimer = setTimeout(function() {
            e.preventDefault();
            const touch = e.touches[0];
            showContextMenuAt(touch.clientX, touch.clientY, cell);
            // 触觉反馈（如果浏览器支持）
            if (navigator.vibrate) navigator.vibrate(30);
        }, 600);
    }, { passive: false });
    
    document.getElementById('myGrid').addEventListener('touchend', function(e) {
        if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
        }
    });
    
    document.getElementById('myGrid').addEventListener('touchmove', function(e) {
        if (longPressTimer) {
            clearTimeout(longPressTimer);
            longPressTimer = null;
        }
    });
    
    // 复制功能
    menuCopy.addEventListener('click', function() {
        if (contextMenuTargetCell) {
            const text = contextMenuTargetCell.textContent || '';
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ 已复制到剪贴板');
            }).catch(() => {
                // 降级方案
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('✅ 已复制到剪贴板');
            });
        }
        hideContextMenu();
    });
    
    // 点击其他地方隐藏菜单
    document.addEventListener('click', hideContextMenu);
    
    // 滚动时隐藏菜单
    document.addEventListener('scroll', hideContextMenu, true);
}

function hideContextMenu() {
    document.getElementById('contextMenu').classList.remove('visible');
}

// ==========================================
// 摄像头条码扫描（手机端）- @zxing/library
// ==========================================
let scanStream = null;
let scanVideoEl = null;
let scanCanvas = null;
let scanReader = null;
let scanTimer = null;
let scanActive = false;

function startCameraScan() {
    if (typeof ZXing === 'undefined') {
        showToast('\u274c 扫码组件未加载，请刷新页面重试');
        return;
    }

    // 先清理上一次可能残留的状态
    scanActive = false;
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }
    if (scanStream) { scanStream.getTracks().forEach(function(t) { t.stop(); }); scanStream = null; }
    scanReader = null;
    scanCanvas = null;

    var overlay = document.getElementById('scanOverlay');
    var viewfinder = document.getElementById('scanViewfinder');
    viewfinder.innerHTML = '';

    // 创建视频元素
    scanVideoEl = document.createElement('video');
    scanVideoEl.setAttribute('playsinline', '');
    scanVideoEl.setAttribute('autoplay', '');
    scanVideoEl.setAttribute('muted', '');
    scanVideoEl.style.cssText = 'width:100%;height:100%;object-fit:cover;';
    viewfinder.appendChild(scanVideoEl);

    // 创建离屏 canvas（不挂载到 DOM），用于逐帧截图喂给 ZXing
    scanCanvas = document.createElement('canvas');
    var scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });

    // 创建 ZXing 多格式解码器
    scanReader = new ZXing.MultiFormatReader();

    // 二维码内容通常含字母/符号，卷烟条码都是纯数字，直接按内容过滤

    overlay.classList.add('active');
    scanActive = true;

    // 启动后置摄像头
    navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
        }
    }).then(function(stream) {
        if (!scanActive) { stream.getTracks().forEach(function(t) { t.stop(); }); return; }
        scanStream = stream;
        scanVideoEl.srcObject = stream;
        scanVideoEl.play();

        // 等视频就绪后开始扫描循环
        scanVideoEl.addEventListener('loadedmetadata', function onLoaded() {
            scanVideoEl.removeEventListener('loadedmetadata', onLoaded);
            if (!scanActive) return;
            scanCanvas.width = scanVideoEl.videoWidth;
            scanCanvas.height = scanVideoEl.videoHeight;

            // 约 150ms 间隔扫描（~6-7 次/秒），平衡识别速度与 CPU 开销
            scanTimer = setInterval(function() {
                if (!scanActive) return;
                if (!scanVideoEl || scanVideoEl.readyState < scanVideoEl.HAVE_ENOUGH_DATA) return;
                try {
                    scanCtx.drawImage(scanVideoEl, 0, 0, scanCanvas.width, scanCanvas.height);
                    var luminanceSource = new ZXing.HTMLCanvasElementLuminanceSource(scanCanvas);
                    var binaryBitmap = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(luminanceSource));
                    var result = scanReader.decode(binaryBitmap);
                    if (result && result.text) {
                        // 跳过非纯数字结果（二维码内容通常含字母/URL等）
                        if (/[^0-9]/.test(result.text.trim())) return;
                        if (navigator.vibrate) navigator.vibrate(100);
                        stopCameraScan();
                        addKeyword(result.text, currentKeywords.length);
                        cursorPosition = currentKeywords.length;
                        input.value = '';
                        renderSearchTags();
                        showToast('\u2705 已扫描: ' + result.text);
                    }
                } catch (e) {
                    // 未识别到条码，继续扫描（ZXing 在无结果时抛 NotFoundException）
                }
            }, 150);
        });
    }).catch(function(err) {
        console.error('Camera init error:', err);
        stopCameraScan();
        if (err.name === 'NotAllowedError' || String(err).indexOf('Permission') !== -1 || String(err).indexOf('NotAllowed') !== -1) {
            showToast('\u274c 请允许使用摄像头');
        } else {
            showToast('\u274c 无法启动扫码');
        }
    });
}

function stopCameraScan() {
    scanActive = false;

    // 停止扫描定时器
    if (scanTimer) { clearInterval(scanTimer); scanTimer = null; }

    // 停止摄像头流
    if (scanStream) {
        scanStream.getTracks().forEach(function(track) { track.stop(); });
        scanStream = null;
    }

    // 清理视频元素
    if (scanVideoEl) {
        scanVideoEl.srcObject = null;
        scanVideoEl = null;
    }

    // 清理解码器和 canvas
    scanReader = null;
    scanCanvas = null;

    // 隐藏覆盖层，清空 viewfinder
    var overlay = document.getElementById('scanOverlay');
    overlay.classList.remove('active');
    var viewfinder = document.getElementById('scanViewfinder');
    if (viewfinder) viewfinder.innerHTML = '';
}

    if (gridApi) {
        gridApi.setGridOption('rowData', []);
    }
    
    // 更新显示
    document.getElementById('dataSource').innerHTML = `数据：<span class="file-name">未导入文件</span>`;
    document.getElementById('recordCount').textContent = `共 0 条`;
    
    // 隐藏筛选状态区
    document.getElementById('filterStatus').classList.remove('visible');
    
    updateInfoBox(false);
    input.focus();
    
    showToast('✅ 已清除保存的数据');
}

// ==========================================
// 清空表格数据
// ==========================================
function loadDemoData() {
    allData = [];
    if (gridApi) {
        gridApi.setGridOption('rowData', []);
    }
    document.getElementById('dataSource').innerHTML = `数据：<span class="file-name">未导入文件</span>`;
    document.getElementById('recordCount').textContent = `共 0 条`;
}

// ==========================================
// 页面初始化
// ==========================================
function initApp() {
    console.log('🚀 开始初始化应用...');
    
    // 初始化 Grid
    const gridDiv = document.querySelector('#myGrid');
    document.getElementById('loadingIndicator').remove();
    gridApi = agGrid.createGrid(gridDiv, gridOptions);
    
    // 初始化扫码逻辑
    initScannerLogic();
    
    // 初始化全局扫描枪捕获（无焦点也能接收扫码）
    initGlobalScannerCapture();
    
    // 初始化右键菜单
    initContextMenu();
    
    // 尝试从本地缓存加载数据（秒开）
    const savedData = loadData();
    let hasCache = false;
    
    if (savedData && savedData.fileData) {
        const formatted = parseExcelData(savedData.fileData);
        if (formatted.length > 0) {
            processData(formatted, savedData.fileName);
            updateInfoBox(true, savedData.fileName, formatted.length);
            showToast(`✅ 自动加载「${savedData.fileName}」，共 ${formatted.length} 条`);
            hasCache = true;
        }
    }
    
    // 后台从服务器拉取最新 Excel，成功则更新缓存和表格
    loadRemoteExcel(hasCache);
    
    // 无缓存时先显示空状态（等 fetch 成功后会自动填充）
    if (!hasCache) {
        loadDemoData();
        updateInfoBox(false);
    }
    
    console.log('✅ 应用初始化完成');
    // 延迟计算视口能容纳的行数（等数据渲染完）
    setTimeout(calcViewportRowCount, 300);
}

// 从服务器加载 Excel 文件并更新数据
// hasCache: 是否已有本地缓存（有缓存时静默更新，无缓存时显示加载提示）
function loadRemoteExcel(hasCache) {
    const REMOTE_EXCEL = '烟草库存模板.xlsx';
    
    fetch(REMOTE_EXCEL + '?t=' + Date.now())
        .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.arrayBuffer();
        })
        .then(arrayBuffer => {
            const formatted = parseExcelData(arrayBuffer);
            if (formatted.length === 0) {
                console.warn('⚠️ 远程 Excel 文件为空或格式不正确');
                return;
            }
            
            // 更新表格数据
            processData(formatted, REMOTE_EXCEL);
            
            // 更新本地缓存
            saveData(REMOTE_EXCEL, arrayBuffer, formatted.length);
            updateInfoBox(true, REMOTE_EXCEL, formatted.length);
            
            if (hasCache) {
                // 已有缓存时静默更新，不打扰用户
                console.log('✅ 已从服务器更新数据');
            } else {
                // 无缓存时提示用户
                showToast(`✅ 已加载「${REMOTE_EXCEL}」，共 ${formatted.length} 条`);
            }
        })
        .catch(err => {
            console.warn('⚠️ 从服务器加载 Excel 失败:', err.message);
            // fetch 失败不影响使用：有缓存用缓存，无缓存就是空状态（可手动导入）
        });
}

// DOM 加载完成后初始化
document.addEventListener('DOMContentLoaded', initApp);

// 窗口大小变化时刷新 AG Grid 布局
let lastDeviceType = isMobile();
window.addEventListener('resize', function() {
    if (gridApi) {
        // 使用防抖避免频繁刷新
        clearTimeout(window.resizeTimer);
        window.resizeTimer = setTimeout(function() {
            calcViewportRowCount();
            // 检测是否跨越了桌面/手机边界，需要切换列配置
            const currentType = isMobile();
            if (currentType !== lastDeviceType) {
                lastDeviceType = currentType;
                console.log(currentType ? '📱 切换到手机端列配置' : '🖥️ 切换到桌面端列配置');
                gridApi.setGridOption('columnDefs', getColumnDefs());
                gridApi.autoSizeAllColumns();
            } else {
                gridApi.autoSizeAllColumns();
            }
        }, 200);
    }
});

// ==========================================
// Service Worker 注册
// ==========================================
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(registration => {
                console.log('✅ Service Worker 注册成功:', registration.scope);
            })
            .catch(err => {
                console.error('❌ Service Worker 注册失败:', err);
            });
    });
}
</script>
